<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16120e">
<title>トロビ タイマー</title>
<style>
  :root {
    --bg: #16120e;
    --surface: #221c15;
    --surface-2: #2d251b;
    --ember: #ff7a2f;
    --ember-dim: #b85a24;
    --text: #f2e9de;
    --text-dim: #a89a88;
    --green: #7fc97f;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: 0; }

  .app {
    width: 100%;
    max-width: 420px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* ---- header ---- */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2px 2px 0;
  }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: .14em; color: var(--text-dim); }
  header h1 span { color: var(--ember); }
  .icon-btn {
    background: transparent; color: var(--text-dim);
    font-size: 19px; padding: 6px 8px; border-radius: 10px; line-height: 1;
  }
  .icon-btn:active { background: var(--surface); }

  /* ---- progress dots ---- */
  .dots { display: flex; justify-content: center; gap: 4px; padding: 16px 0 6px; }
  .dots button {
    background: transparent; padding: 8px 5px; line-height: 0;
  }
  .dots i {
    display: block; width: 9px; height: 9px; border-radius: 50%;
    background: #3a3128; transition: background .2s, transform .2s;
  }
  .dots button.done i { background: var(--ember-dim); }
  .dots button.on i { background: var(--ember); transform: scale(1.5); }

  /* ---- stage ---- */
  .stage {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    position: relative;
    padding: 6px 0 14px;
    min-height: 380px;
    transition: transform .2s cubic-bezier(.2,.8,.3,1);
    touch-action: pan-y;
  }
  .stage.dragging { transition: none; }
  .stage.enter-l { animation: enterL .24s ease-out; }
  .stage.enter-r { animation: enterR .24s ease-out; }
  @keyframes enterL {
    from { transform: translateX(-34px); opacity: .3; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes enterR {
    from { transform: translateX(34px); opacity: .3; }
    to { transform: translateX(0); opacity: 1; }
  }
  .beat {
    position: absolute; inset: -20px 0; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(255,122,47,.2), transparent 62%);
    opacity: 0; transition: opacity .14s;
  }
  .beat.flash { opacity: 1; transition: opacity 0s; }

  .ex-name {
    background: transparent; color: var(--text);
    font-size: 23px; font-weight: 700; letter-spacing: .02em;
    padding: 4px 6px; display: flex; align-items: center; gap: 7px;
  }
  .ex-name .caret { font-size: 12px; color: var(--text-dim); transition: transform .2s; }
  .ex-name.open .caret { transform: rotate(180deg); }
  .ex-meta { font-size: 12px; color: var(--text-dim); letter-spacing: .06em; margin-top: 1px; }

  .howto {
    max-width: 340px; font-size: 13px; line-height: 1.85; color: var(--text-dim);
    background: var(--surface); border-radius: 14px;
    padding: 0 14px; margin-top: 10px;
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height .25s ease, opacity .2s, padding .25s;
    text-align: left;
  }
  .howto.open { max-height: 320px; opacity: 1; padding: 13px 14px; }

  .time {
    font-size: 92px; font-weight: 200; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.03em;
    margin: 18px 0 4px;
  }
  .time.count-down { color: var(--ember); }
  .time.done { color: var(--green); }
  .time.prep { color: var(--text-dim); }
  .time.tiny { font-size: 44px; letter-spacing: 0; }

  .phase {
    font-size: 15px; letter-spacing: .32em; font-weight: 700;
    color: var(--ember); min-height: 21px;
  }
  .sub { font-size: 14px; color: var(--text-dim); min-height: 40px; padding: 4px 8px 0; line-height: 1.6; }
  .sub b { color: var(--text); font-weight: 700; }

  /* ---- actions ---- */
  .main-btn {
    width: 100%; border-radius: var(--radius);
    padding: 23px; font-size: 20px; font-weight: 700;
    background: var(--ember); color: #1c1207;
    letter-spacing: .1em; transition: filter .1s;
  }
  .main-btn:active { filter: brightness(.85); }
  .main-btn.running { background: var(--surface-2); color: var(--text); }
  .foot { display: flex; justify-content: center; gap: 22px; padding: 12px 0 2px; min-height: 42px; }
  .foot button {
    background: transparent; color: var(--text-dim);
    font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px;
  }
  .foot button:active { background: var(--surface); }
  .foot button.hide { display: none; }

  /* ---- sheets ---- */
  .sheet-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 10;
  }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    background: var(--bg); border-radius: 20px 20px 0 0;
    padding: 6px 16px max(20px, env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y: auto;
    transform: translateY(101%); transition: transform .26s cubic-bezier(.2,.8,.3,1);
    box-shadow: 0 -8px 40px rgba(0,0,0,.5);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-inner { max-width: 420px; margin: 0 auto; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--surface-2); margin: 8px auto 14px; }
  .sheet h2 { font-size: 15px; font-weight: 700; margin-bottom: 14px; letter-spacing: .06em; }
  .sheet section { margin-bottom: 22px; }

  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .row .label { font-size: 12px; color: var(--text-dim); flex: 0 0 4.2em; white-space: nowrap; }
  .seg { display: flex; flex: 1; background: var(--surface); border-radius: 10px; padding: 3px; }
  .seg button {
    flex: 1; background: transparent; color: var(--text-dim);
    font-size: 13px; font-weight: 600; padding: 9px 4px; border-radius: 8px;
    transition: background .15s, color .15s;
  }
  .seg button.on { background: var(--ember-dim); color: var(--text); }
  .seg button small { display: block; font-size: 10px; opacity: .7; margin-top: 1px; }
  .stepper { display: flex; flex: 1; align-items: center; background: var(--surface); border-radius: 10px; padding: 3px; }
  .stepper button { flex: 0 0 46px; background: transparent; color: var(--ember); font-size: 18px; font-weight: 700; padding: 9px 0; border-radius: 8px; }
  .stepper button:active { background: var(--ember-dim); color: var(--text); }
  .stepper .week-disp { flex: 1; text-align: center; font-size: 13px; font-weight: 600; }
  .stepper .week-disp small { color: var(--text-dim); }

  .rec-day { font-size: 12px; color: var(--ember); font-weight: 700; margin-bottom: 8px; }
  .rec-row {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 14px; padding: 9px 11px; margin-bottom: 6px;
    background: var(--surface); border-radius: 10px;
  }
  .rec-row .n { color: var(--text-dim); font-size: 12px; flex: 1; }
  .rec-row .s { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rec-row .r { color: var(--text-dim); font-size: 11px; }
  .empty { font-size: 13px; color: var(--text-dim); text-align: center; padding: 14px; }

  .body-inputs { display: flex; gap: 8px; }
  .body-inputs label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .body-inputs input {
    width: 100%; min-width: 0; border-radius: 8px;
    background: var(--surface); color: var(--text); border: 0;
    font-size: 16px; font-family: inherit; font-variant-numeric: tabular-nums;
    padding: 9px 6px; text-align: center;
  }
  .body-inputs input::placeholder { color: #6b6154; }
  .body-inputs input:focus { outline: 2px solid var(--ember-dim); }

  .btn-row { display: flex; gap: 8px; }
  .btn-row button {
    flex: 1; border-radius: 10px; padding: 13px 8px;
    background: var(--surface); color: var(--text);
    font-size: 13px; font-weight: 600;
  }
  .btn-row button:active { background: var(--ember-dim); }
  .msg { font-size: 12px; color: var(--green); min-height: 17px; margin-top: 9px; }
  .note { font-size: 11px; color: var(--text-dim); line-height: 1.8; }
  .danger { color: var(--ember) !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>トロビ<span>.</span></h1>
    <button class="icon-btn" id="openSettings" aria-label="設定">⚙</button>
  </header>

  <div class="dots" id="dots"></div>

  <div class="stage">
    <div class="beat" id="beatFlash"></div>
    <button class="ex-name" id="exName"><span id="exNameText">—</span><span class="caret">▾</span></button>
    <div class="ex-meta" id="exMeta"></div>
    <div class="howto" id="howto"></div>
    <div class="time" id="timeDisp">0</div>
    <div class="phase" id="phaseDisp"></div>
    <div class="sub" id="subDisp"></div>
  </div>

  <button class="main-btn" id="mainBtn">開始</button>

  <div class="foot">
    <button id="openRecord">記録</button>
    <button id="extraSetBtn" class="hide">もう1セット</button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg"></div>

<div class="sheet" id="settingsSheet">
  <div class="sheet-inner">
    <div class="grab"></div>
    <h2>設定</h2>
    <section>
      <div class="row">
        <span class="label">週</span>
        <div class="stepper">
          <button id="weekMinus">−</button>
          <div class="week-disp" id="weekDisp"></div>
          <button id="weekPlus">＋</button>
        </div>
      </div>
      <div class="row">
        <span class="label">メニュー</span>
        <div class="seg" id="daySeg">
          <button data-day="mon">肩の日<small>週の前半</small></button>
          <button data-day="thu">腕の日<small>週の後半</small></button>
        </div>
      </div>
      <div class="row">
        <span class="label">準備</span>
        <div class="seg" id="prepSeg">
          <button data-prep="0">なし</button>
          <button data-prep="3" class="on">3秒</button>
          <button data-prep="5">5秒</button>
        </div>
      </div>
      <div class="row">
        <span class="label">音</span>
        <div class="seg" id="soundSeg">
          <button data-sound="on" class="on">鳴らす</button>
          <button data-sound="off">消す</button>
        </div>
      </div>
    </section>
    <section>
      <p class="note">
        テンポは週と種目から自動で決まります（単関節は第7週から4秒かけて下ろす）。メニューは前回やった方の逆が選ばれます。<br><br>
        1セット目は限界の直前まで。止めた秒数の8割が、次のセットのカウントダウンになります。片側種目は左→右で1セットです。<br><br>
        種目の移動は左右スワイプ、または上のドットをタップ。<br><br>
        音が鳴らないときは、本体の音量を上げてから「鳴らす」を押し直してください（確認音が鳴ります）。
      </p>
    </section>
  </div>
</div>

<div class="sheet" id="recordSheet">
  <div class="sheet-inner">
    <div class="grab"></div>
    <h2>記録</h2>
    <section id="recToday"></section>
    <section>
      <div class="rec-day">朝の体組成（任意）</div>
      <div class="body-inputs">
        <label><span>体重 kg</span><input type="number" inputmode="decimal" step="0.1" id="bodyW" placeholder="61.8"></label>
        <label><span>体脂肪 %</span><input type="number" inputmode="decimal" step="0.1" id="bodyF" placeholder="22.4"></label>
        <label><span>骨格筋 %</span><input type="number" inputmode="decimal" step="0.1" id="bodyM" placeholder="33.8"></label>
      </div>
    </section>
    <section>
      <div class="btn-row">
        <button id="copyBtn">今日の記録をコピー</button>
        <button id="csvBtn">全履歴をCSV</button>
      </div>
      <div class="msg" id="exportMsg"></div>
    </section>
    <section>
      <div class="btn-row">
        <button id="resetExBtn" class="danger">今の種目をやり直す</button>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---- menu data（トロビ 12週プログラム v0.2）----
  const PHASES = [
    { from: 1, to: 2, label: "火をつける" },
    { from: 3, to: 6, label: "とろ火" },
    { from: 7, to: 10, label: "火加減を覚える" },
    { from: 11, to: 12, label: "自分で焚く" },
  ];
  const phaseIndex = week => week <= 2 ? 0 : week <= 6 ? 1 : 2;
  const phaseLabel = week => PHASES.find(p => week >= p.from && week <= p.to).label;

  // sets は資料の「1回の構成」より（押す/引く=3、しゃがむ/股関節=左右2ずつ、単関節=2）
  const SLOTS = [
    { slot: "押す", sets: 3, byPhase: [
      { name: "膝つき腕立て伏せ", weight: "自重",
        howto: "膝をつき、頭から膝まで一直線。胸が床から拳ひとつ分まで下ろす。肘は真横ではなく体から45度。腰を落とさない。" },
      { name: "腕立て伏せ", weight: "自重",
        howto: "頭から踵まで一直線。胸が床から拳ひとつ分まで。肘は体から45度。腰を落とさない。きつければ膝つきを続けてよい。" },
      { name: "腕立て伏せ（足を椅子に）", weight: "自重",
        howto: "足を椅子に乗せて行う。頭から踵まで一直線、胸は拳ひとつ分まで、肘は体から45度。腰を落とさない。" },
    ]},
    { slot: "引く", sets: 3, byPhase: [
      { name: "ワンハンドロー", weight: "2.3kg", uni: true,
        howto: "片手と片膝を椅子や台に置き、背中を真っ直ぐ。ダンベルを脇腹に向かって引き上げ、ゆっくり下ろす。" },
      { name: "テーブルロー", weight: "自重",
        howto: "丈夫な机の下に仰向けで潜り、縁を掴んで胸を天板に引き寄せる。体は一直線。膝を曲げると易しくなる。※机が動かない・体重に耐えることを必ず確認。不安ならワンハンドロー（5.4kg）を継続。" },
      { name: "テーブルロー（足伸ばし）", weight: "自重",
        howto: "テーブルローの足を伸ばし、体を水平に近づけて行う。体は一直線のまま胸を天板へ。※机の安定を必ず確認。" },
    ]},
    { slot: "しゃがむ", sets: 2, byPhase: [
      { name: "自重スプリットスクワット", weight: "自重", uni: true,
        howto: "足を前後に開き、後ろ膝を床に向けて真下に下ろす。上体は真っ直ぐ、前膝はつま先より前に出さない。" },
      { name: "スプリットスクワット", weight: "5.4kg×2", uni: true,
        howto: "両手にダンベルを持ち体側に垂らす。後ろ膝を床に向けて真下に下ろし、上体は真っ直ぐ。前膝はつま先より前に出さない。" },
      { name: "ブルガリアンスクワット", weight: "5.4kg×2", uni: true,
        howto: "後ろ足の甲を椅子に乗せ、両手にダンベル。後ろ膝を真下に下ろす。上体は真っ直ぐ、前膝はつま先より前に出さない。" },
    ]},
    { slot: "股関節", sets: 2, byPhase: [
      { name: "ヒップリフト", weight: "自重",
        howto: "仰向けで膝を立て、かかとで床を押してお尻を持ち上げる。肩から膝まで一直線になったらお尻を締め、ゆっくり下ろす。" },
      { name: "ルーマニアンデッドリフト", weight: "5.4kg×2",
        howto: "膝を軽く曲げたまま固定し、股関節から折る。ダンベルを脚に沿わせて膝下まで。太もも裏が伸びたら戻る。背中が丸まったら即中止。" },
      { name: "片脚ルーマニアンデッドリフト", weight: "5.4kg×1〜2", uni: true,
        howto: "片脚で立ち、膝を軽く曲げたまま股関節から折る。ダンベルを脚に沿わせて下ろし、背中は最後まで真っ直ぐ。丸まったら即中止。" },
    ]},
  ];
  const ISO_EX = {
    mon: [
      { name: "サイドレイズ", weight: "2.3kg×2",
        howto: "直立して肘を軽く曲げ、腕を真横に開いて肩の高さで止める。それ以上は上げない。肩をすくめない（首に力が入ったらフォーム崩れ）。下ろすときも力を抜かない。" },
      { name: "リアレイズ", weight: "2.3kg×2",
        howto: "上体を45度前傾。肘を軽く曲げ、腕を後方・斜め上に開く。肩甲骨を寄せることより腕を開くことを意識。首をすくめない。" },
    ],
    thu: [
      { name: "カール", weight: "2.3kg×2",
        howto: "肘を体の横に固定して動かさない。ダンベルだけを上げ、上げきったところで一瞬締める。軽すぎると感じたら5.4kgに上げてよい（第3週以降）。" },
      { name: "キックバック", weight: "2.3kg×2",
        howto: "上体を前傾し、上腕を体側に固定。肘から先だけを後方に伸ばす。上腕が動いたら効いていない。" },
    ],
  };
  const WARMUP_STEPS = [
    { name: "その場足踏み", sec: 60 },
    { name: "肩回し 前後各10回", sec: 40 },
    { name: "自重スクワット ゆっくり10回", sec: 40 },
    { name: "股関節回し 各10回", sec: 40 },
  ];
  const WARMUP_TOTAL = WARMUP_STEPS.reduce((a, s) => a + s.sec, 0);

  // ---- 週の保存 ----
  const mondayOf = d => {
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() - (x.getDay() + 6) % 7);
    return x;
  };
  function loadWeek() {
    try {
      const s = JSON.parse(localStorage.getItem("torobi.week"));
      if (s && s.week && s.anchor) {
        const diff = Math.round((mondayOf(new Date()) - new Date(s.anchor)) / 604800000);
        return Math.min(12, Math.max(1, s.week + diff));
      }
    } catch (e) { /* 壊れた保存値は無視 */ }
    return 1;
  }
  function saveWeek(w) {
    try {
      localStorage.setItem("torobi.week", JSON.stringify({ week: w, anchor: mondayOf(new Date()).toISOString() }));
    } catch (e) { /* プライベートブラウズ等では保存しない */ }
  }

  // ---- 記録の保存 ----
  const LOG_KEY = "torobi.log";
  const todayKey = () => {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  };
  const WDAY = ["日", "月", "火", "水", "木", "金", "土"];
  const SIDE_JA = { L: "左", R: "右" };
  function loadLog() {
    try { return JSON.parse(localStorage.getItem(LOG_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveLog(log) {
    try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); }
    catch (e) { /* 保存できない環境では黙って続行 */ }
  }
  function todayEntry(log) {
    const k = todayKey();
    if (!log[k]) log[k] = { week: state.week, day: state.day, sets: [], body: {} };
    log[k].week = state.week;
    log[k].day = state.day;
    return log[k];
  }
  function recordSet(exName, slot, no, sec, side = null) {
    const log = loadLog();
    const e = todayEntry(log);
    const i = e.sets.findIndex(s => s.ex === exName && s.no === no && (s.side || null) === side);
    const row = { ex: exName, slot, no, sec, ...(side ? { side } : {}) };
    i >= 0 ? e.sets[i] = row : e.sets.push(row);
    saveLog(log);
  }
  function clearRecordedExercise(exName) {
    const log = loadLog();
    const e = todayEntry(log);
    e.sets = e.sets.filter(s => s.ex !== exName);
    saveLog(log);
  }
  function saveBody() {
    const log = loadLog();
    const e = todayEntry(log);
    const num = el => (el.value === "" ? undefined : Number(el.value));
    e.body = { w: num(bodyW), f: num(bodyF), m: num(bodyM) };
    saveLog(log);
  }
  function lastTimeSeconds(exName, side = null) {
    const log = loadLog();
    const k = todayKey();
    const days = Object.keys(log).filter(d => d < k).sort().reverse();
    for (const d of days) {
      const hit = (log[d].sets || []).find(
        s => s.ex === exName && s.no === 1 && (s.side || null) === side);
      if (hit) return { sec: hit.sec, date: d };
    }
    return null;
  }
  function lastSessionDay() {
    const log = loadLog();
    const days = Object.keys(log).filter(d => (log[d].sets || []).length > 0).sort();
    if (days.length === 0) return null;
    const date = days[days.length - 1];
    return { date, day: log[date].day };
  }
  // 初期選択は「前回やった方の逆」。記録がなければ曜日から
  function autoDay() {
    const last = lastSessionDay();
    if (last) return last.date === todayKey() ? last.day : (last.day === "mon" ? "thu" : "mon");
    const d = new Date().getDay();
    return (d >= 1 && d <= 3) ? "mon" : "thu";
  }

  // ---- state ----
  const state = {
    week: loadWeek(),
    day: null,
    exercises: [],
    exIndex: 0,
    running: false,
    mode: "up",          // "warmup" | "prep" | "up"(1セット目) | "down"(2セット目以降)
    prep: 3,
    lastPrepSec: -1,
    lastWuStep: -1,
    startTime: 0,
    elapsed: 0,
    tempoDown: 2,
    tempoUp: 2,
    sound: true,
    rafId: null,
    lastBeatIndex: -1,
    wakeLock: null,
  };
  state.day = autoDay();

  function buildExercises() {
    const p = phaseIndex(state.week);
    const main4 = SLOTS.map(s => ({ ...s.byPhase[p], slot: s.slot, target: s.sets }));
    const iso2 = ISO_EX[state.day].map(e => ({ ...e, slot: "単関節", target: 2, isolation: true }));
    state.exercises = [
      { warmup: true, name: "ウォームアップ", weight: "3分", done: false },
      ...[...main4, ...iso2].map(e => ({
        ...e,
        sets: [], base: { L: null, R: null }, goal: { L: null, R: null },
        setNo: 1, side: e.uni ? "L" : null,
      })),
    ];
    restoreToday();
    state.exIndex = firstUndone();
  }

  const cur = () => state.exercises[state.exIndex];
  const repSeconds = () => state.tempoDown + state.tempoUp;
  const toReps = sec => Math.floor(sec / repSeconds());
  const fmt = sec => String(Math.max(0, Math.ceil(sec)));
  const curBase = ex => ex.uni ? ex.base[ex.side] : ex.base.L;
  const curGoal = ex => ex.uni ? ex.goal[ex.side] : ex.goal.L;

  // 片側種目は「左→右」で1セット
  function nextPos(ex) {
    if (!ex.uni) return { setNo: ex.sets.reduce((m, s) => Math.max(m, s.no), 0) + 1, side: null };
    const has = (no, side) => ex.sets.some(s => s.no === no && s.side === side);
    let no = 1;
    while (has(no, "L") && has(no, "R")) no++;
    return { setNo: no, side: has(no, "L") ? "R" : "L" };
  }
  function doneSets(ex) {
    if (ex.warmup) return ex.done ? 1 : 0;
    if (!ex.uni) return ex.sets.length;
    const nos = [...new Set(ex.sets.map(s => s.no))];
    return nos.filter(n => ex.sets.some(s => s.no === n && s.side === "L")
                        && ex.sets.some(s => s.no === n && s.side === "R")).length;
  }
  const isComplete = ex => ex.warmup ? ex.done : doneSets(ex) >= ex.target;
  // 開いたとき最初に出す種目。すでに始めていれば、ウォームアップは飛ばして続きから
  function firstUndone() {
    const started = state.exercises.some(e => !e.warmup && e.sets.length > 0);
    const from = started ? 1 : 0;
    const i = state.exercises.findIndex((e, idx) => idx >= from && !isComplete(e));
    return i < 0 ? state.exercises.length - 1 : i;
  }

  function restoreToday() {
    const e = loadLog()[todayKey()];
    if (!e) return;
    state.exercises.forEach(ex => {
      if (ex.warmup) return;
      const mine = (e.sets || []).filter(s => s.ex === ex.name).sort((a, b) => a.no - b.no);
      if (mine.length === 0) return;
      ex.sets = mine.map(s => ({ no: s.no, seconds: s.sec, side: s.side || null }));
      ["L", "R"].forEach(side => {
        const first = mine.find(s => s.no === 1 && (s.side || "L") === side);
        if (first) {
          ex.base[side] = first.sec;
          ex.goal[side] = Math.max(1, Math.round(first.sec * 0.8));
        }
      });
      Object.assign(ex, nextPos(ex));
    });
  }

  // ---- elements ----
  const $ = id => document.getElementById(id);
  const dots = $("dots"), exNameBtn = $("exName"), exNameText = $("exNameText");
  const exMeta = $("exMeta"), howto = $("howto"), timeDisp = $("timeDisp");
  const phaseDisp = $("phaseDisp"), subDisp = $("subDisp"), mainBtn = $("mainBtn");
  const beatFlash = $("beatFlash"), extraSetBtn = $("extraSetBtn"), stage = document.querySelector(".stage");
  const weekDisp = $("weekDisp"), daySeg = $("daySeg"), prepSeg = $("prepSeg"), soundSeg = $("soundSeg");
  const bodyW = $("bodyW"), bodyF = $("bodyF"), bodyM = $("bodyM");
  const exportMsg = $("exportMsg"), recToday = $("recToday");
  const sheetBg = $("sheetBg"), settingsSheet = $("settingsSheet"), recordSheet = $("recordSheet");

  // ---- audio ----
  // iOS Safariは消音スイッチでWeb Audioがミュートされるため、セッションを
  // playback扱いにし、無音ループでメディア再生セッションを維持する。
  let audioCtx = null, silentEl = null;
  const SILENT_WAV = "data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";
  function ensureAudio() {
    try { if ("audioSession" in navigator) navigator.audioSession.type = "playback"; }
    catch (e) { /* 未対応ブラウザは無視 */ }
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    if (!silentEl) {
      silentEl = new Audio(SILENT_WAV);
      silentEl.loop = true;
      silentEl.setAttribute("playsinline", "");
    }
    silentEl.play().catch(() => {});
    const buf = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(0);
  }
  const stopSilentLoop = () => { if (silentEl) silentEl.pause(); };
  function beep(freq, dur, gainVal) {
    if (!audioCtx || !state.sound) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(gainVal, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }
  const beepDown = () => beep(440, 0.12, 0.5);
  const beepUp = () => beep(880, 0.12, 0.5);
  const beepPrep = () => beep(660, 0.1, 0.4);
  function alarm() {
    [0, 0.18, 0.36, 0.54].forEach((d, i) => {
      setTimeout(() => beep(i === 3 ? 1320 : 990, 0.15, 0.6), d * 1000);
    });
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
  }

  // ---- wake lock ----
  async function acquireWakeLock() {
    try { if ("wakeLock" in navigator) state.wakeLock = await navigator.wakeLock.request("screen"); }
    catch (e) { /* 取れなくても致命的ではない */ }
  }
  function releaseWakeLock() {
    if (state.wakeLock) { state.wakeLock.release().catch(() => {}); state.wakeLock = null; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state.running) acquireWakeLock();
  });

  // ---- テンポは週と種目から自動 ----
  function autoTempo() {
    state.tempoDown = (cur().isolation && state.week >= 7) ? 4 : 2;
  }

  // ---- rendering ----
  function renderDots() {
    dots.innerHTML = state.exercises.map((e, i) =>
      `<button data-i="${i}" class="${isComplete(e) ? "done" : ""}${i === state.exIndex ? " on" : ""}" aria-label="${e.name}"><i></i></button>`
    ).join("");
  }

  function renderIdle() {
    const ex = cur();
    renderDots();
    howto.textContent = ex.warmup
      ? WARMUP_STEPS.map((s, i) => `${i + 1}. ${s.name}（${s.sec}秒）`).join("\n")
      : ex.howto;
    exNameText.textContent = ex.name;
    phaseDisp.textContent = "";
    mainBtn.classList.remove("running");
    timeDisp.classList.remove("tiny");

    if (ex.warmup) {
      exMeta.textContent = ex.done ? "3分 ─ 完了 ✓" : "3分・4ステップ";
      timeDisp.textContent = String(WARMUP_TOTAL);
      timeDisp.className = "time";
      subDisp.textContent = ex.done ? "" : "音が切り替わったら次の動きへ";
      mainBtn.textContent = ex.done ? "次の種目へ ▸" : "ウォームアップ開始";
      extraSetBtn.classList.add("hide");
      return;
    }

    const side = ex.uni ? SIDE_JA[ex.side] : "";
    exMeta.textContent = `${ex.weight}${ex.uni ? "・左右" : ""}`;

    if (isComplete(ex)) {
      const first = ex.sets.filter(s => s.no === 1);
      timeDisp.textContent = ex.uni
        ? `${(first.find(s => s.side === "L") || {}).seconds ?? "-"} / ${(first.find(s => s.side === "R") || {}).seconds ?? "-"}`
        : String(first.length ? first[0].seconds : "-");
      timeDisp.className = "time done" + (ex.uni ? " tiny" : "");
      subDisp.innerHTML = `${ex.target}セット完了${ex.uni ? "（左 / 右）" : ""}`;
      mainBtn.textContent = state.exIndex < state.exercises.length - 1 ? "次の種目へ ▸" : "今日は終わり";
      extraSetBtn.classList.remove("hide");
      return;
    }

    extraSetBtn.classList.add("hide");
    const setInfo = `セット${ex.setNo}/${ex.target}${side ? "・" + side : ""}`;
    if (ex.setNo === 1) {
      const prev = lastTimeSeconds(ex.name, ex.side);
      timeDisp.textContent = "0";
      timeDisp.className = "time";
      subDisp.innerHTML = prev
        ? `${setInfo}　全力<br>前回${side} <b>${prev.sec}秒</b> を上回る`
        : `${setInfo}　全力<br>崩れる直前まで`;
      mainBtn.textContent = `開始${side ? `（${side}）` : ""}`;
    } else {
      timeDisp.textContent = fmt(curGoal(ex));
      timeDisp.className = "time count-down";
      subDisp.innerHTML = `${setInfo}　8割<br>1セット目${side} <b>${curBase(ex)}秒</b> → <b>${curGoal(ex)}秒</b>`;
      mainBtn.textContent = `開始${side ? `（${side}）` : ""}`;
    }
  }

  // ---- metronome ----
  function handleBeats(elapsed) {
    const rep = repSeconds();
    const inRep = elapsed % rep;
    const down = inRep < state.tempoDown;
    phaseDisp.textContent = down ? "↓ 下ろす" : "↑ 上げる";
    const beatIndex = Math.floor(elapsed / rep) * 2 + (down ? 0 : 1);
    if (beatIndex !== state.lastBeatIndex) {
      state.lastBeatIndex = beatIndex;
      if (elapsed > 0.05) (down ? beepDown : beepUp)();
      flashBeat();
    }
  }
  function flashBeat() {
    beatFlash.classList.add("flash");
    setTimeout(() => beatFlash.classList.remove("flash"), 100);
  }

  // ---- loop ----
  function tick() {
    if (!state.running) return;
    const elapsed = (performance.now() - state.startTime) / 1000;
    state.elapsed = elapsed;

    if (state.mode === "warmup") {
      if (elapsed >= WARMUP_TOTAL) { finishWarmup(); return; }
      let acc = 0, idx = 0, remain = 0;
      for (let i = 0; i < WARMUP_STEPS.length; i++) {
        if (elapsed < acc + WARMUP_STEPS[i].sec) { idx = i; remain = acc + WARMUP_STEPS[i].sec - elapsed; break; }
        acc += WARMUP_STEPS[i].sec;
      }
      timeDisp.textContent = fmt(remain);
      exMeta.textContent = `${idx + 1} / ${WARMUP_STEPS.length}`;
      subDisp.innerHTML = `<b>${WARMUP_STEPS[idx].name}</b>`;
      if (idx !== state.lastWuStep) {
        state.lastWuStep = idx;
        if (elapsed > 0.05) beep(990, 0.2, 0.6);
        if (navigator.vibrate) navigator.vibrate(150);
        flashBeat();
      }
    } else if (state.mode === "prep") {
      const remain = state.prep - elapsed;
      if (remain <= 0) { startWork(); }
      else {
        const shown = Math.ceil(remain);
        timeDisp.textContent = String(shown);
        if (shown !== state.lastPrepSec) { state.lastPrepSec = shown; beepPrep(); flashBeat(); }
      }
    } else if (state.mode === "up") {
      timeDisp.textContent = fmt(Math.floor(elapsed));
      subDisp.innerHTML = `約 <b>${toReps(elapsed)}</b> 回`;
      handleBeats(elapsed);
    } else {
      const remain = curGoal(cur()) - elapsed;
      if (remain <= 0) { finishCountdown(); return; }
      timeDisp.textContent = fmt(remain);
      handleBeats(elapsed);
    }
    state.rafId = requestAnimationFrame(tick);
  }

  // ---- flow ----
  function start() {
    const ex = cur();
    if (isComplete(ex)) { advance(); return; }
    ensureAudio();
    acquireWakeLock();
    state.running = true;
    state.lastBeatIndex = -1;
    timeDisp.classList.remove("tiny");
    extraSetBtn.classList.add("hide");
    if (ex.warmup) {
      state.mode = "warmup";
      state.startTime = performance.now();
      state.lastWuStep = -1;
      timeDisp.className = "time count-down";
      phaseDisp.textContent = "";
      mainBtn.textContent = "中断";
    } else if (state.prep > 0) {
      state.mode = "prep";
      state.startTime = performance.now();
      state.lastPrepSec = -1;
      timeDisp.className = "time prep";
      timeDisp.textContent = String(state.prep);
      phaseDisp.textContent = "構えて";
      subDisp.textContent = "";
      mainBtn.textContent = "キャンセル";
    } else {
      startWork();
    }
    mainBtn.classList.add("running");
    state.rafId = requestAnimationFrame(tick);
  }

  function startWork() {
    const ex = cur();
    state.mode = ex.setNo === 1 ? "up" : "down";
    state.startTime = performance.now();
    state.lastBeatIndex = -1;
    timeDisp.className = state.mode === "down" ? "time count-down" : "time";
    mainBtn.textContent = "終了";
    beepDown();
  }

  function halt() {
    state.running = false;
    if (state.rafId) cancelAnimationFrame(state.rafId);
    releaseWakeLock();
  }

  function cancel() {
    halt();
    stopSilentLoop();
    renderIdle();
  }

  function finishWarmup() {
    halt();
    alarm();
    setTimeout(stopSilentLoop, 1500);
    cur().done = true;
    advance();
  }

  function stop() {
    halt();
    stopSilentLoop();
    const ex = cur();
    const seconds = Math.round(state.elapsed);
    const side = ex.side;
    const sideJa = ex.uni ? SIDE_JA[side] : "";
    let msg;
    if (state.mode === "up") {
      const key = ex.uni ? side : "L";
      ex.base[key] = seconds;
      ex.goal[key] = Math.max(1, Math.round(seconds * 0.8));
      ex.sets.push({ no: ex.setNo, seconds, side });
      const prev = lastTimeSeconds(ex.name, side);
      const diff = prev ? seconds - prev.sec : null;
      const cmp = diff == null ? ""
        : diff > 0 ? `前回より <b>+${diff}秒</b> 🔥<br>` : diff < 0 ? `前回より ${diff}秒<br>` : "前回と同じ<br>";
      msg = `${cmp}<b>${seconds}秒</b> ＝ 約${toReps(seconds)}回`;
    } else {
      ex.sets.push({ no: ex.setNo, seconds, side });
      msg = `${sideJa}${seconds}秒で終了`;
    }
    recordSet(ex.name, ex.slot, ex.setNo, seconds, side);
    Object.assign(ex, nextPos(ex));
    renderIdle();
    timeDisp.textContent = String(seconds);
    timeDisp.className = "time done";
    subDisp.innerHTML = msg;
  }

  function finishCountdown() {
    halt();
    alarm();
    setTimeout(stopSilentLoop, 1500);
    const ex = cur();
    const done = curGoal(ex);
    ex.sets.push({ no: ex.setNo, seconds: done, side: ex.side });
    recordSet(ex.name, ex.slot, ex.setNo, done, ex.side);
    Object.assign(ex, nextPos(ex));
    renderIdle();
    timeDisp.textContent = "0";
    timeDisp.className = "time done";
    subDisp.innerHTML = `<b>${done}秒</b> 完了。ここで止めるのが正解`;
  }

  function goto(i, dir = 0) {
    if (state.running) cancel();
    const next = Math.max(0, Math.min(i, state.exercises.length - 1));
    if (next === state.exIndex && dir) return false;
    state.exIndex = next;
    howto.classList.remove("open");
    exNameBtn.classList.remove("open");
    autoTempo();
    renderIdle();
    if (dir) {
      stage.classList.remove("enter-l", "enter-r");
      void stage.offsetWidth;               // アニメーションを確実に再生させる
      stage.classList.add(dir > 0 ? "enter-l" : "enter-r");
    }
    return true;
  }
  function advance() {
    if (state.exIndex < state.exercises.length - 1) goto(state.exIndex + 1, 1);
    else {
      renderIdle();
      subDisp.innerHTML = "今日はここまで。<b>おつかれさまでした 🔥</b>";
    }
  }

  // ---- 書き出し ----
  function buildTodayText() {
    const e = loadLog()[todayKey()];
    if (!e || (e.sets || []).length === 0) return null;
    const firsts = e.sets.filter(s => s.no === 1);
    const line = rows => {
      const order = [], byEx = {};
      rows.forEach(s => {
        if (!order.includes(s.ex)) { order.push(s.ex); byEx[s.ex] = []; }
        byEx[s.ex].push(s);
      });
      return order.map(name => {
        const rs = byEx[name];
        const val = rs[0].side
          ? ["L", "R"].map(sd => {
              const hit = rs.find(r => r.side === sd);
              return hit ? `${SIDE_JA[sd]}${hit.sec}` : null;
            }).filter(Boolean).join(" ")
          : String(rs[0].sec);
        return `${name} ${val}`;
      }).join(" / ");
    };
    const k = todayKey();
    const lines = [`${k}（${WDAY[new Date(k + "T00:00:00").getDay()]}）`];
    const main = firsts.filter(s => s.slot !== "単関節");
    const iso = firsts.filter(s => s.slot === "単関節");
    if (main.length) lines.push(line(main));
    if (iso.length) lines.push(line(iso));
    const b = e.body || {};
    const body = [
      b.w != null ? `体重 ${b.w}` : null,
      b.f != null ? `体脂肪 ${b.f}` : null,
      b.m != null ? `骨格筋 ${b.m}` : null,
    ].filter(Boolean);
    if (body.length) lines.push(body.join(" / "));
    return lines.join("\n");
  }

  function buildCsv() {
    const log = loadLog();
    const rows = [["日付", "週", "メニュー", "種目", "枠", "セット", "左右", "秒数", "回数換算", "体重", "体脂肪率", "骨格筋率"]];
    Object.keys(log).sort().forEach(date => {
      const e = log[date];
      const b = e.body || {};
      const order = [];
      (e.sets || []).forEach(s => { if (!order.includes(s.ex)) order.push(s.ex); });
      (e.sets || []).slice().sort((a, c) =>
        order.indexOf(a.ex) - order.indexOf(c.ex) || a.no - c.no || (a.side || "").localeCompare(c.side || "")
      ).forEach(s => {
        rows.push([
          date, e.week, e.day === "mon" ? "肩" : "腕", s.ex, s.slot, s.no,
          s.side ? SIDE_JA[s.side] : "", s.sec, Math.floor(s.sec / 4),
          b.w ?? "", b.f ?? "", b.m ?? "",
        ]);
      });
    });
    if (rows.length === 1) return null;
    const esc = v => {
      const t = String(v);
      return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
    };
    return rows.map(r => r.map(esc).join(",")).join("\r\n");
  }

  function flash(msg, ok = true) {
    exportMsg.textContent = msg;
    exportMsg.style.color = ok ? "var(--green)" : "var(--ember)";
    setTimeout(() => { exportMsg.textContent = ""; }, 4000);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }
  }

  async function exportCsv() {
    const csv = buildCsv();
    if (!csv) { flash("まだ書き出す記録がありません", false); return; }
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const file = new File([blob], `torobi-${todayKey()}.csv`, { type: "text/csv" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "トロビ 記録" }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    flash("CSVを書き出しました");
  }

  function renderRecord() {
    const e = loadLog()[todayKey()];
    const sets = (e && e.sets) || [];
    if (sets.length === 0) {
      recToday.innerHTML = `<div class="rec-day">今日</div><div class="empty">まだ記録がありません</div>`;
      return;
    }
    const order = [];
    sets.forEach(s => { if (!order.includes(s.ex)) order.push(s.ex); });
    const rows = order.map(name => {
      const mine = sets.filter(s => s.ex === name).sort((a, b) => a.no - b.no || (a.side || "").localeCompare(b.side || ""));
      return mine.map(s => `<div class="rec-row">
        <span class="n">${name}${s.side ? " " + SIDE_JA[s.side] : ""}　セット${s.no}</span>
        <span class="s">${s.sec}秒</span>
        <span class="r">${s.no === 1 ? "基準値" : ""}</span>
      </div>`).join("");
    }).join("");
    recToday.innerHTML = `<div class="rec-day">${todayKey()}</div>${rows}`;
  }

  // ---- sheets ----
  function openSheet(el) {
    if (el === recordSheet) renderRecord();
    sheetBg.classList.add("open");
    el.classList.add("open");
  }
  function closeSheets() {
    sheetBg.classList.remove("open");
    settingsSheet.classList.remove("open");
    recordSheet.classList.remove("open");
  }

  // ---- events ----
  mainBtn.addEventListener("click", () => {
    if (!state.running) { start(); return; }
    (state.mode === "prep" || state.mode === "warmup") ? cancel() : stop();
  });

  extraSetBtn.addEventListener("click", () => {
    const ex = cur();
    ex.target += 1;          // その日だけ1セット増やす
    renderIdle();
  });

  dots.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const i = Number(b.dataset.i);
    goto(i, i === state.exIndex ? 0 : (i > state.exIndex ? 1 : -1));
  });

  // 左右スワイプで種目を移動（計測中とシート表示中は無効）
  (() => {
    let x0 = null, y0 = null, dragging = false;
    const target = document.querySelector(".app");
    const active = () => !state.running && !sheetBg.classList.contains("open");
    target.addEventListener("touchstart", e => {
      if (!active() || e.touches.length !== 1) { x0 = null; return; }
      x0 = e.touches[0].clientX;
      y0 = e.touches[0].clientY;
      dragging = false;
    }, { passive: true });
    target.addEventListener("touchmove", e => {
      if (x0 == null) return;
      const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
      if (!dragging && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
        dragging = true;
        stage.classList.add("dragging");
      }
      if (dragging) stage.style.transform = `translateX(${dx * 0.4}px)`;
    }, { passive: true });
    target.addEventListener("touchend", e => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      stage.classList.remove("dragging");
      stage.style.transform = "";
      x0 = null;
      if (!dragging) return;
      dragging = false;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        const dir = dx < 0 ? 1 : -1;
        goto(state.exIndex + dir, dir);
      }
    });
  })();

  exNameBtn.addEventListener("click", () => {
    howto.classList.toggle("open");
    exNameBtn.classList.toggle("open");
  });

  $("openSettings").addEventListener("click", () => openSheet(settingsSheet));
  $("openRecord").addEventListener("click", () => openSheet(recordSheet));
  sheetBg.addEventListener("click", closeSheets);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheets(); });

  // 下方向スワイプで閉じる（一番上までスクロールしているときだけ）
  [settingsSheet, recordSheet].forEach(sheet => {
    sheet.querySelector(".grab").addEventListener("click", closeSheets);
    let y0 = null;
    sheet.addEventListener("touchstart", e => {
      y0 = sheet.scrollTop <= 0 ? e.touches[0].clientY : null;
    }, { passive: true });
    sheet.addEventListener("touchmove", e => {
      if (y0 == null) return;
      const dy = e.touches[0].clientY - y0;
      if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
    }, { passive: true });
    sheet.addEventListener("touchend", e => {
      if (y0 == null) return;
      const dy = (e.changedTouches[0].clientY - y0);
      sheet.style.transform = "";
      if (dy > 70) closeSheets();
      y0 = null;
    });
  });

  $("weekMinus").addEventListener("click", () => changeWeek(-1));
  $("weekPlus").addEventListener("click", () => changeWeek(1));
  function changeWeek(d) {
    const w = Math.min(12, Math.max(1, state.week + d));
    if (w === state.week) return;
    if (state.running) cancel();
    state.week = w;
    saveWeek(w);
    renderWeek();
    buildExercises();
    autoTempo();
    renderIdle();
  }
  function renderWeek() {
    weekDisp.innerHTML = `第${state.week}週 <small>／ ${phaseLabel(state.week)}</small>`;
  }

  daySeg.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.day === state.day) return;
    if (state.running) cancel();
    state.day = b.dataset.day;
    daySeg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.day === state.day));
    buildExercises();
    autoTempo();
    renderIdle();
  });

  prepSeg.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    state.prep = Number(b.dataset.prep);
    prepSeg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  });

  soundSeg.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    state.sound = b.dataset.sound === "on";
    soundSeg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    if (state.sound) {
      ensureAudio();
      beepUp();
      if (!state.running) setTimeout(stopSilentLoop, 500);
    }
  });

  [bodyW, bodyF, bodyM].forEach(el => el.addEventListener("change", saveBody));

  $("copyBtn").addEventListener("click", async () => {
    const text = buildTodayText();
    if (!text) { flash("今日の記録がまだありません", false); return; }
    const ok = await copyText(text);
    flash(ok ? "今日の記録をコピーしました" : "コピーできませんでした", ok);
  });
  $("csvBtn").addEventListener("click", exportCsv);

  $("resetExBtn").addEventListener("click", () => {
    const ex = cur();
    if (state.running) cancel();
    if (ex.warmup) ex.done = false;
    else {
      clearRecordedExercise(ex.name);
      ex.sets = [];
      ex.base = { L: null, R: null };
      ex.goal = { L: null, R: null };
      ex.setNo = 1;
      ex.side = ex.uni ? "L" : null;
    }
    renderRecord();
    renderIdle();
    closeSheets();
  });

  // ---- init ----
  daySeg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.day === state.day));
  saveWeek(state.week);
  renderWeek();
  buildExercises();
  autoTempo();
  renderIdle();
  (() => {
    const b = (loadLog()[todayKey()] || {}).body || {};
    if (b.w != null) bodyW.value = b.w;
    if (b.f != null) bodyF.value = b.f;
    if (b.m != null) bodyM.value = b.m;
  })();
})();
</script>
</body>
</html>
