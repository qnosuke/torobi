<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16120e">
<title>トロビ タイマー</title>
<style>
  :root {
    --bg: #16120e;
    --surface: #221c15;
    --surface-2: #2d251b;
    --ember: #ff7a2f;
    --ember-dim: #b85a24;
    --text: #f2e9de;
    --text-dim: #a89a88;
    --green: #7fc97f;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
  }
  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 4px 2px;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: .12em; }
  header h1 span { color: var(--ember); }
  header .tagline { font-size: 11px; color: var(--text-dim); letter-spacing: .08em; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px;
  }
  .settings { display: flex; flex-direction: column; gap: 8px; }

  .row { display: flex; gap: 8px; align-items: center; }
  .row .label { font-size: 12px; color: var(--text-dim); flex: 0 0 3.5em; }
  .seg { display: flex; flex: 1; background: var(--surface-2); border-radius: 10px; padding: 3px; }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--text-dim);
    font-size: 13px; font-weight: 600; padding: 8px 4px; border-radius: 8px;
    font-family: inherit; cursor: pointer; transition: background .15s, color .15s;
  }
  .seg button.on { background: var(--ember-dim); color: var(--text); }
  .toggle {
    flex: 0 0 auto; border: 0; border-radius: 10px; padding: 11px 14px;
    background: var(--surface-2); color: var(--text-dim);
    font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .toggle.on { background: var(--ember-dim); color: var(--text); }

  /* ---- exercise list ---- */
  .ex-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 0; border-radius: 10px; padding: 9px 12px;
    background: var(--surface-2); color: var(--text-dim);
    font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .chip.on { background: var(--ember-dim); color: var(--text); }
  .chip .done { color: var(--green); font-size: 12px; }
  .chip .cnt { font-size: 11px; opacity: .8; }

  /* ---- main display ---- */
  .display {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px; padding: 24px 14px;
    position: relative; overflow: hidden;
  }
  .set-label { font-size: 14px; color: var(--text-dim); letter-spacing: .06em; text-align: center; }
  .set-label b { color: var(--ember); font-size: 16px; }
  .time {
    font-size: 84px; font-weight: 200; line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .time.count-down { color: var(--ember); }
  .time.done { color: var(--green); }
  .time.prep { color: var(--text-dim); }
  .sub { font-size: 14px; color: var(--text-dim); min-height: 20px; text-align: center; }
  .sub b { color: var(--text); }
  .beat {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 60%, rgba(255,122,47,.22), transparent 65%);
    opacity: 0; transition: opacity .12s;
  }
  .beat.flash { opacity: 1; transition: opacity 0s; }
  .phase { font-size: 15px; letter-spacing: .3em; color: var(--ember); min-height: 22px; font-weight: 600; }

  /* ---- controls ---- */
  .main-btn {
    width: 100%; border: 0; border-radius: var(--radius);
    padding: 22px; font-size: 20px; font-weight: 700; font-family: inherit;
    background: var(--ember); color: #1c1207; cursor: pointer;
    letter-spacing: .1em;
    transition: filter .1s;
  }
  .main-btn:active { filter: brightness(.85); }
  .main-btn.running { background: var(--surface-2); color: var(--text); }
  .sub-actions { display: flex; gap: 10px; }
  .sub-actions button {
    flex: 1; border: 0; border-radius: 12px; padding: 12px;
    background: var(--surface); color: var(--text-dim);
    font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .sub-actions button:active { background: var(--surface-2); }

  /* ---- set history ---- */
  .sets { display: flex; flex-direction: column; gap: 8px; }
  .sets .empty { font-size: 12px; color: var(--text-dim); text-align: center; padding: 6px; }
  .set-row {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 14px; padding: 8px 10px;
    background: var(--surface-2); border-radius: 10px;
  }
  .set-row .n { color: var(--text-dim); font-size: 12px; flex: 0 0 4.5em; }
  .set-row .s { font-weight: 700; font-variant-numeric: tabular-nums; }
  .set-row .r { color: var(--text-dim); font-size: 12px; margin-left: auto; }
  .hint { font-size: 11px; color: var(--text-dim); line-height: 1.7; padding: 0 4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>トロビ<span>.</span>タイマー</h1>
    <div class="tagline">強火にしない。</div>
  </header>

  <div class="card settings">
    <div class="row">
      <span class="label">メニュー</span>
      <div class="seg" id="daySeg">
        <button data-day="mon">月（肩）</button>
        <button data-day="thu">木（腕）</button>
      </div>
      <button class="toggle on" id="metroToggle">♪</button>
    </div>
    <div class="row">
      <span class="label">テンポ</span>
      <div class="seg" id="tempoSeg">
        <button data-down="2" class="on">2秒↓ 2秒↑</button>
        <button data-down="4">4秒↓ 2秒↑</button>
      </div>
    </div>
    <div class="row">
      <span class="label">準備</span>
      <div class="seg" id="prepSeg">
        <button data-prep="0">なし</button>
        <button data-prep="3" class="on">3秒</button>
        <button data-prep="5">5秒</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="ex-list" id="exList"></div>
  </div>

  <div class="card display">
    <div class="beat" id="beatFlash"></div>
    <div class="set-label" id="setLabel"></div>
    <div class="time" id="timeDisp">0</div>
    <div class="phase" id="phaseDisp"></div>
    <div class="sub" id="subDisp"></div>
  </div>

  <button class="main-btn" id="mainBtn">開始</button>

  <div class="sub-actions">
    <button id="resetExBtn">この種目をやり直す</button>
    <button id="nextExerciseBtn">次の種目へ ▸</button>
  </div>

  <div class="card sets" id="setList">
    <div class="empty">まだ記録がありません</div>
  </div>

  <div class="hint">
    メニューは曜日から自動選択されます（月〜水＝月メニュー、木〜日＝木メニュー）。ウォームアップは3分・4ステップを音で切り替えながらガイドします。各種目、1セット目はストップウォッチで限界の直前まで。止めた秒数の8割が2セット目以降のカウントダウンに自動セットされます。メトロノーム（♪）は下ろし始めが低い音・上げ始めが高い音。♪をタップすると確認音が鳴ります。音が出ないときは本体の音量を上げてください。
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---- menu data（トロビ 12週プログラム v0.2 の1回の構成）----
  const COMMON_EX = [
    { name: "腕立て伏せ", note: "押す" },
    { name: "テーブルロー", note: "引く" },
    { name: "スクワット系", note: "しゃがむ・左右" },
    { name: "RDL系", note: "股関節・左右" },
  ];
  const DAY_EX = {
    mon: [
      { name: "サイドレイズ", note: "肩" },
      { name: "リアレイズ", note: "背中上部" },
    ],
    thu: [
      { name: "カール", note: "腕・前" },
      { name: "キックバック", note: "腕・裏" },
    ],
  };
  // ウォームアップ3分。足踏みのみ時間指定、残りは回数目安を時間に割り付け
  const WARMUP_STEPS = [
    { name: "その場足踏み", sec: 60 },
    { name: "肩回し 前後各10回", sec: 40 },
    { name: "自重スクワット ゆっくり10回", sec: 40 },
    { name: "股関節回し 各10回", sec: 40 },
  ];
  const WARMUP_TOTAL = WARMUP_STEPS.reduce((a, s) => a + s.sec, 0);
  // 月〜水は月メニュー、木〜日は木メニュー
  function autoDay() {
    const d = new Date().getDay(); // Sun=0 ... Sat=6
    return (d >= 1 && d <= 3) ? "mon" : "thu";
  }

  // ---- state ----
  const state = {
    day: autoDay(),
    exercises: [],       // [{name, note, sets:[], baseSeconds, targetSeconds, setNo}]
    exIndex: 0,
    running: false,
    mode: "up",          // "prep" | "up"(set1 stopwatch) | "down"(set2+ countdown)
    prep: 3,             // 準備インターバル秒数
    lastPrepSec: -1,
    startTime: 0,
    elapsed: 0,
    tempoDown: 2,
    tempoUp: 2,
    metronome: true,
    rafId: null,
    lastBeatIndex: -1,
    wakeLock: null,
  };

  function buildExercises() {
    state.exercises = [
      { warmup: true, name: "ウォームアップ", note: "3分", done: false },
      ...[...COMMON_EX, ...DAY_EX[state.day]].map(e => ({
        ...e, sets: [], baseSeconds: null, targetSeconds: null, setNo: 1,
      })),
    ];
    state.exIndex = 0;
  }
  const cur = () => state.exercises[state.exIndex];

  // ---- elements ----
  const $ = id => document.getElementById(id);
  const timeDisp = $("timeDisp");
  const subDisp = $("subDisp");
  const setLabel = $("setLabel");
  const phaseDisp = $("phaseDisp");
  const mainBtn = $("mainBtn");
  const setList = $("setList");
  const beatFlash = $("beatFlash");
  const metroToggle = $("metroToggle");
  const tempoSeg = $("tempoSeg");
  const daySeg = $("daySeg");
  const prepSeg = $("prepSeg");
  const exList = $("exList");

  // ---- audio ----
  // iOS Safariでは、(1) AudioContextはユーザー操作内で生成・resumeが必要、
  // (2) 消音スイッチ(マナーモード)がオンだとWeb Audioはミュートされる。
  // (2)への対策として、Audio Session APIでセッションを"playback"(メディア再生)扱いに
  // し、さらに無音の<audio>ループを再生してメディア再生セッションを維持する。
  let audioCtx = null;
  let silentEl = null;
  const SILENT_WAV = "data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";
  function ensureAudio() {
    try {
      if ("audioSession" in navigator) navigator.audioSession.type = "playback";
    } catch (e) { /* 未対応ブラウザは無視 */ }
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    if (!silentEl) {
      silentEl = new Audio(SILENT_WAV);
      silentEl.loop = true;
      silentEl.setAttribute("playsinline", "");
    }
    silentEl.play().catch(() => {});
    // ユーザー操作内で無音バッファを一度鳴らして出力をアンロック
    const buf = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(0);
  }
  function stopSilentLoop() {
    if (silentEl) silentEl.pause();
  }
  function beep(freq, dur, gainVal) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(gainVal, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }
  const beepDown = () => beep(440, 0.12, 0.5);   // 下ろし始め: 低い音
  const beepUp   = () => beep(880, 0.12, 0.5);   // 上げ始め: 高い音
  const beepPrep = () => beep(660, 0.1, 0.4);    // 準備カウント
  function alarm() {
    if (!audioCtx) return;
    [0, 0.18, 0.36, 0.54].forEach((d, i) => {
      setTimeout(() => beep(i === 3 ? 1320 : 990, 0.15, 0.6), d * 1000);
    });
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
  }

  // ---- wake lock ----
  async function acquireWakeLock() {
    try {
      if ("wakeLock" in navigator) {
        state.wakeLock = await navigator.wakeLock.request("screen");
      }
    } catch (e) { /* not critical */ }
  }
  function releaseWakeLock() {
    if (state.wakeLock) { state.wakeLock.release().catch(() => {}); state.wakeLock = null; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state.running) acquireWakeLock();
  });

  // ---- helpers ----
  const repSeconds = () => state.tempoDown + state.tempoUp;
  const toReps = sec => Math.floor(sec / repSeconds());
  const fmt = sec => String(Math.max(0, Math.ceil(sec)));

  // ---- rendering ----
  function renderExList() {
    exList.innerHTML = state.exercises.map((e, i) => {
      const done = e.warmup
        ? (e.done ? `<span class="done">✓</span>` : "")
        : (e.sets.length > 0 ? `<span class="done">✓</span><span class="cnt">${e.sets.length}</span>` : "");
      return `<button class="chip${i === state.exIndex ? " on" : ""}" data-i="${i}">${e.name}${done}</button>`;
    }).join("");
  }

  function renderSets() {
    const ex = cur();
    if (ex.warmup) {
      setList.innerHTML = WARMUP_STEPS.map((s, i) => `<div class="set-row">
        <span class="n">${i + 1}</span>
        <span class="s">${s.name}</span>
        <span class="r">${s.sec}秒</span>
      </div>`).join("");
      return;
    }
    if (ex.sets.length === 0) {
      setList.innerHTML = `<div class="empty">${ex.name}：まだ記録がありません</div>`;
      return;
    }
    setList.innerHTML = ex.sets.map(s => {
      const mark = s.no === 1 ? "（基準値）" : "";
      return `<div class="set-row">
        <span class="n">セット${s.no}</span>
        <span class="s">${s.seconds}秒</span>
        <span class="r">約${toReps(s.seconds)}回 ${mark}</span>
      </div>`;
    }).join("");
  }

  function updateIdleUI() {
    const ex = cur();
    if (ex.warmup) {
      setLabel.innerHTML = `<b>ウォームアップ</b>（3分）${ex.done ? " ✓済" : ""}`;
      subDisp.textContent = "4つのステップを音で切り替えながらガイドします";
      timeDisp.textContent = String(WARMUP_TOTAL);
      timeDisp.className = "time";
      mainBtn.textContent = "ウォームアップ開始";
      phaseDisp.textContent = "";
      mainBtn.classList.remove("running");
      renderExList();
      renderSets();
      return;
    }
    if (ex.setNo === 1) {
      setLabel.innerHTML = `<b>${ex.name}</b>（${ex.note}）─ セット1・全力`;
      subDisp.textContent = "タップで開始、限界が来たらタップで終了";
      timeDisp.textContent = "0";
      timeDisp.className = "time";
      mainBtn.textContent = "開始";
    } else {
      setLabel.innerHTML = `<b>${ex.name}</b>（${ex.note}）─ セット${ex.setNo}・8割で止める`;
      subDisp.innerHTML = `1セット目 <b>${ex.baseSeconds}秒</b> → 目標 <b>${ex.targetSeconds}秒</b>（約${toReps(ex.targetSeconds)}回）`;
      timeDisp.textContent = fmt(ex.targetSeconds);
      timeDisp.className = "time count-down";
      mainBtn.textContent = `セット${ex.setNo} 開始`;
    }
    phaseDisp.textContent = "";
    mainBtn.classList.remove("running");
    renderExList();
    renderSets();
  }

  // ---- metronome / phase within a rep ----
  function handleBeats(elapsed) {
    const rep = repSeconds();
    const inRep = elapsed % rep;
    const phase = inRep < state.tempoDown ? "down" : "up";
    phaseDisp.textContent = phase === "down" ? "↓ 下ろす" : "↑ 上げる";

    const repIndex = Math.floor(elapsed / rep);
    const beatIndex = repIndex * 2 + (phase === "up" ? 1 : 0);
    if (beatIndex !== state.lastBeatIndex) {
      state.lastBeatIndex = beatIndex;
      if (state.metronome && elapsed > 0.05) {
        phase === "down" ? beepDown() : beepUp();
      }
      beatFlash.classList.add("flash");
      setTimeout(() => beatFlash.classList.remove("flash"), 100);
    }
  }

  // ---- main loop ----
  function tick() {
    if (!state.running) return;
    const now = performance.now();
    const elapsed = (now - state.startTime) / 1000;
    state.elapsed = elapsed;

    if (state.mode === "warmup") {
      if (elapsed >= WARMUP_TOTAL) {
        finishWarmup();
        return;
      }
      let acc = 0, idx = 0, stepRemain = 0;
      for (let i = 0; i < WARMUP_STEPS.length; i++) {
        if (elapsed < acc + WARMUP_STEPS[i].sec) {
          idx = i;
          stepRemain = acc + WARMUP_STEPS[i].sec - elapsed;
          break;
        }
        acc += WARMUP_STEPS[i].sec;
      }
      timeDisp.textContent = fmt(stepRemain);
      setLabel.innerHTML = `<b>ウォームアップ</b> ─ ${idx + 1}/${WARMUP_STEPS.length}`;
      subDisp.innerHTML = `<b>${WARMUP_STEPS[idx].name}</b>`;
      if (idx !== state.lastWuStep) {
        state.lastWuStep = idx;
        if (state.metronome && elapsed > 0.05) beep(990, 0.2, 0.6);
        if (navigator.vibrate) navigator.vibrate(150);
        beatFlash.classList.add("flash");
        setTimeout(() => beatFlash.classList.remove("flash"), 100);
      }
    } else if (state.mode === "prep") {
      const remain = state.prep - elapsed;
      if (remain <= 0) {
        startWork();
      } else {
        const shown = Math.ceil(remain);
        timeDisp.textContent = String(shown);
        if (shown !== state.lastPrepSec) {
          state.lastPrepSec = shown;
          if (state.metronome) beepPrep();
          beatFlash.classList.add("flash");
          setTimeout(() => beatFlash.classList.remove("flash"), 100);
        }
      }
    } else if (state.mode === "up") {
      timeDisp.textContent = fmt(Math.floor(elapsed));
      subDisp.innerHTML = `約 <b>${toReps(elapsed)}</b> 回`;
      handleBeats(elapsed);
    } else {
      const remain = cur().targetSeconds - elapsed;
      if (remain <= 0) {
        finishCountdown();
        return;
      }
      timeDisp.textContent = fmt(remain);
      subDisp.innerHTML = `目標 <b>${cur().targetSeconds}秒</b>（約${toReps(cur().targetSeconds)}回）`;
      handleBeats(elapsed);
    }
    state.rafId = requestAnimationFrame(tick);
  }

  // ---- flow ----
  function start() {
    ensureAudio();
    acquireWakeLock();
    state.running = true;
    state.lastBeatIndex = -1;
    if (cur().warmup) {
      // ウォームアップは準備カウントなしで即開始
      state.mode = "warmup";
      state.startTime = performance.now();
      state.lastWuStep = -1;
      timeDisp.className = "time count-down";
      phaseDisp.textContent = "";
      mainBtn.textContent = "中断";
      mainBtn.classList.add("running");
    } else if (state.prep > 0) {
      state.mode = "prep";
      state.startTime = performance.now();
      state.lastPrepSec = -1;
      timeDisp.className = "time prep";
      timeDisp.textContent = String(state.prep);
      phaseDisp.textContent = "構えて";
      subDisp.textContent = "";
      mainBtn.textContent = "キャンセル";
      mainBtn.classList.add("running");
    } else {
      startWork();
      mainBtn.classList.add("running");
    }
    state.rafId = requestAnimationFrame(tick);
  }

  function startWork() {
    const ex = cur();
    state.mode = ex.setNo === 1 ? "up" : "down";
    state.startTime = performance.now();
    state.lastBeatIndex = -1;
    timeDisp.className = state.mode === "down" ? "time count-down" : "time";
    setLabel.innerHTML = `<b>${ex.name}</b> ─ セット${ex.setNo}`;
    mainBtn.textContent = "終了";
    if (state.metronome) beepDown();
  }

  function cancelPrep() {
    state.running = false;
    if (state.rafId) cancelAnimationFrame(state.rafId);
    releaseWakeLock();
    stopSilentLoop();
    updateIdleUI();
  }

  function finishWarmup() {
    state.running = false;
    if (state.rafId) cancelAnimationFrame(state.rafId);
    releaseWakeLock();
    alarm();
    setTimeout(stopSilentLoop, 1500);
    cur().done = true;
    // 完了したら最初の種目へ自動で進む
    state.exIndex = Math.min(state.exIndex + 1, state.exercises.length - 1);
    updateIdleUI();
    subDisp.innerHTML = "ウォームアップ完了。<b>本番へ 🔥</b>";
  }

  function stop() {
    state.running = false;
    if (state.rafId) cancelAnimationFrame(state.rafId);
    releaseWakeLock();
    stopSilentLoop();

    const ex = cur();
    const seconds = Math.round(state.elapsed);
    if (state.mode === "up") {
      // 1セット目終了 → この種目の基準値になる
      ex.baseSeconds = seconds;
      ex.targetSeconds = Math.max(1, Math.round(seconds * 0.8));
      ex.sets.push({ no: ex.setNo, seconds });
      timeDisp.className = "time done";
      subDisp.innerHTML = `記録 <b>${seconds}秒</b> ＝ 約${toReps(seconds)}回。次からは <b>${ex.targetSeconds}秒</b> で止めます`;
    } else {
      // カウントダウンを途中で止めた: 実際にやった秒数を記録
      ex.sets.push({ no: ex.setNo, seconds });
      subDisp.innerHTML = `セット${ex.setNo}：${seconds}秒で終了`;
    }
    ex.setNo += 1;
    phaseDisp.textContent = "";
    setLabel.innerHTML = `<b>${ex.name}</b> ─ セット${ex.setNo}・8割で止める`;
    mainBtn.textContent = `セット${ex.setNo} 開始`;
    mainBtn.classList.remove("running");
    renderExList();
    renderSets();
  }

  function finishCountdown() {
    state.running = false;
    if (state.rafId) cancelAnimationFrame(state.rafId);
    releaseWakeLock();
    alarm();
    // アラームが鳴り終わるまで無音ループを維持
    setTimeout(stopSilentLoop, 1500);

    const ex = cur();
    ex.sets.push({ no: ex.setNo, seconds: ex.targetSeconds });
    timeDisp.textContent = "0";
    timeDisp.className = "time done";
    phaseDisp.textContent = "";
    subDisp.innerHTML = `セット${ex.setNo} 完了 ─ <b>${ex.targetSeconds}秒</b>。ここで止めるのが正解`;
    ex.setNo += 1;
    setLabel.innerHTML = `<b>${ex.name}</b> ─ セット${ex.setNo}・8割で止める`;
    mainBtn.textContent = `セット${ex.setNo} 開始`;
    mainBtn.classList.remove("running");
    renderExList();
    renderSets();
  }

  function stopIfRunning() {
    if (state.running) {
      state.running = false;
      if (state.rafId) cancelAnimationFrame(state.rafId);
      releaseWakeLock();
      stopSilentLoop();
    }
  }

  function resetCurrentExercise() {
    stopIfRunning();
    const ex = cur();
    if (ex.warmup) {
      ex.done = false;
    } else {
      ex.sets = [];
      ex.baseSeconds = null;
      ex.targetSeconds = null;
      ex.setNo = 1;
    }
    updateIdleUI();
  }

  function gotoExercise(i) {
    stopIfRunning();
    state.exIndex = i;
    updateIdleUI();
  }

  function nextExercise() {
    if (state.exIndex < state.exercises.length - 1) {
      gotoExercise(state.exIndex + 1);
    } else {
      stopIfRunning();
      updateIdleUI();
      subDisp.innerHTML = "今日のメニューはここまで。<b>おつかれさまでした 🔥</b>";
    }
  }

  // ---- events ----
  mainBtn.addEventListener("click", () => {
    if (state.running) {
      // 準備カウント中とウォームアップ中は記録せず中断扱い
      (state.mode === "prep" || state.mode === "warmup") ? cancelPrep() : stop();
    } else {
      start();
    }
  });

  $("nextExerciseBtn").addEventListener("click", nextExercise);
  $("resetExBtn").addEventListener("click", resetCurrentExercise);

  exList.addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    gotoExercise(Number(btn.dataset.i));
  });

  daySeg.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn || btn.dataset.day === state.day) return;
    stopIfRunning();
    state.day = btn.dataset.day;
    daySeg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.day === state.day));
    buildExercises();
    updateIdleUI();
  });

  prepSeg.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    state.prep = Number(btn.dataset.prep);
    prepSeg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
  });

  metroToggle.addEventListener("click", () => {
    state.metronome = !state.metronome;
    metroToggle.classList.toggle("on", state.metronome);
    if (state.metronome) {
      // テスト音を1回鳴らして、音が出る状態かその場で確認できるようにする
      ensureAudio();
      beepUp();
      if (!state.running) setTimeout(stopSilentLoop, 500);
    }
  });

  tempoSeg.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn || state.running) return;
    tempoSeg.querySelectorAll("button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    state.tempoDown = Number(btn.dataset.down);
    updateIdleUI();
  });

  // ---- init ----
  daySeg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.day === state.day));
  buildExercises();
  updateIdleUI();
})();
</script>
</body>
</html>
